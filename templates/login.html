{% extends "base.html" %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <h2>Welcome back</h2>
    <p class="muted">Login as a student or sponsor.</p>
    <form method="post">
      <label>Username</label><input name="username" required>
      <label>Password</label><input type="password" name="password" required>
      <button class="btn primary full">Login</button>
    </form>
    <p class="center">New user? <a href="{{ url_for('register') }}">Register</a></p>
    <div class="demo-box"><b>Demo Student:</b> student1 / student123<br><b>Demo Sponsor:</b> sponsor1 / sponsor123</div>
  </div>
</div>
{% endblock %}
