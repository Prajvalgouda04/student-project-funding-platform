{% extends "base.html" %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card wide">
    <h2>Create account</h2>
    <form method="post">
      <div class="grid two">
        <div><label>Username</label><input name="username" required></div>
        <div><label>Full name</label><input name="name" required></div>
        <div><label>Mobile</label><input name="mobile"></div>
        <div><label>Email</label><input type="email" name="email"></div>
        <div><label>Role</label><select name="role"><option value="student">Student</option><option value="sponsor">Sponsor</option></select></div>
        <div><label>Password</label><input type="password" name="password" required></div>
        <div><label>Confirm password</label><input type="password" name="confirm_password" required></div>
      </div>
      <button class="btn primary full">Register</button>
    </form>
  </div>
</div>
{% endblock %}
